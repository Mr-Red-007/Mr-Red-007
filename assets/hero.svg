<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="title" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2a6d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ff2a6d" stroke-opacity="0.09"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
    .scan { animation: sweep 5s linear infinite; }
    @keyframes sweep { from { transform: translateY(-90px); } to { transform: translateY(340px); } }
    .ring { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .rise { animation: rise 1s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>

  <rect width="1000" height="340" fill="#07070b"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <rect width="1000" height="340" fill="url(#vignette)"/>
  <rect class="scan" x="0" y="0" width="1000" height="90" fill="url(#sweep)"/>

  <!-- corner brackets -->
  <g stroke="#ff2a6d" stroke-width="2" fill="none" stroke-opacity="0.8">
    <path d="M24 24 H64 M24 24 V64"/>
    <path d="M976 24 H936 M976 24 V64"/>
    <path d="M24 316 H64 M24 316 V276"/>
    <path d="M976 316 H936 M976 316 V276"/>
  </g>

  <!-- pulsing scope rings -->
  <g fill="none" stroke="#ff2a6d">
    <circle cx="790" cy="170" r="150" stroke-opacity="0.25" class="ring" style="animation-delay:0s"/>
    <circle cx="790" cy="170" r="105" stroke-opacity="0.45" class="ring" style="animation-delay:1s"/>
    <circle cx="790" cy="170" r="60" stroke-opacity="0.7" class="ring" style="animation-delay:2s"/>
  </g>
  <line x1="630" y1="170" x2="950" y2="170" stroke="#ff2a6d" stroke-opacity="0.35"/>
  <line x1="790" y1="10" x2="790" y2="330" stroke="#ff2a6d" stroke-opacity="0.35"/>
  <circle cx="790" cy="170" r="4" fill="#ff2a6d"/>
  <circle cx="842" cy="128" r="3" fill="#00e5ff"/>
  <circle cx="724" cy="214" r="3" fill="#2ee59d"/>

  <!-- title -->
  <text class="rise" x="60" y="150" font-size="76" font-weight="700" fill="url(#title)" filter="url(#glow)">MR-RED-007</text>
  <text class="rise" x="62" y="186" font-size="17" fill="#8b8fa3" letter-spacing="3" style="animation-delay:.2s">OPERATOR // PENTESTER // AI RED TEAM</text>

  <!-- terminal line -->
  <text class="rise" x="60" y="236" font-size="18" fill="#c9cbd6" style="animation-delay:.4s"><tspan fill="#ff2a6d">root@mr-red-007:~$</tspan> ./status --check</text>
  <rect class="cursor" x="418" y="218" width="10" height="20" fill="#c9cbd6"/>
  <text class="rise" x="60" y="268" font-size="18" fill="#c9cbd6" style="animation-delay:.6s"><tspan fill="#2ee59d">[ONLINE]</tspan> authorized engagements only</text>

  <text x="60" y="310" font-size="12" fill="#4a4e63" letter-spacing="2">SYS::OK   SCOPE::PERMITTED   MODE::DEFENSIVE-OFFENSE</text>
</svg>
