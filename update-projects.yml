name: Update projects

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build project rows from public repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "users/Mr-Red-007/repos?sort=updated&per_page=100" --paginate \
            --jq '.[] | select(.fork == false and .archived == false and .name != "Mr-Red-007")
                  | "| [**\(.name)**](\(.html_url)) | \(.description // "—" | gsub("\\|"; "/")) |"' \
            > projects.md

      - name: Replace the section in README
        run: |
          python3 - << 'PY'
          import re
          readme = open("README.md", encoding="utf-8").read()
          rows = open("projects.md", encoding="utf-8").read().strip()
          block = ("<!-- PROJECTS:START -->\n"
                   "| Project | What it does |\n|---|---|\n"
                   + rows + "\n<!-- PROJECTS:END -->")
          new = re.sub(r"<!-- PROJECTS:START -->.*?<!-- PROJECTS:END -->", block, readme, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(new)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update project list" && git push)
